<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>حجوزات عيادة د. حازم عبد الحميد</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #eef1f5; --card: #fff; --ink: #10263b; --primary: #0f6e7a; --primary-dark: #0b525b; --primary-light: #e6f2f3;
      --blue: #1f5fbf; --green: #1e8a55; --amber: #a86400; --amber-bg: #fdf3dc; --red: #c0392b;
      --text: #14212e; --muted: #62707f; --border: #dde3ea; --pad: max(14px, calc((100vw - 760px) / 2));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 92px; font-size: 15px; line-height: 1.5; }
    button, input, select { font: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .topbar { background: var(--ink); color: #fff; padding: 12px var(--pad); position: sticky; top: 0; z-index: 50; }
    .topbar.admin-mode { background: #1b1f3b; }
    .topbar-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .clinic-title { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: 700; padding: 0; width: 100%; outline: none; }
    .role-badge { display: inline-block; font-size: 12px; font-weight: 500; color: #b9c7d6; margin-top: 1px; cursor: pointer; }
    .admin-mode .role-badge { color: #f0c36a; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-btn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .icon-btn.conn { border-color: transparent; padding-inline: 0; cursor: default; display: inline-flex; align-items: center; gap: 6px; color: #b9c7d6; font-size: 12px; }
    .icon-btn.conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #3ecf8e; }
    .icon-btn.conn.off::before { background: #e5604f; }

    .day-bar { background: #fff; padding: 10px var(--pad); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .day-select-wrap { display: flex; align-items: center; gap: 10px; flex: 1; }
    .day-lbl { font-size: 13px; color: var(--muted); font-weight: 500; white-space: nowrap; }
    .day-select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); font-weight: 600; font-size: 14px; color: var(--ink); background: #fff; flex: 1; max-width: 280px; }
    .new-day-btn { background: #fff; border: 1px solid var(--border); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 14px var(--pad) 6px; }
    .stat-box { background: var(--card); border-radius: 10px; padding: 10px 6px; text-align: center; border: 1px solid var(--border); }
    .stat-num { font-size: 22px; font-weight: 700; line-height: 1.2; }
    .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .controls { padding: 8px var(--pad); position: sticky; top: 74px; background: var(--bg); z-index: 40; }
    .search-wrap { position: relative; }
    .search-input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; background: #fff; outline: none; }
    .search-input:focus { border-color: var(--primary); }
    .clear-search { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #e6ebf0; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; display: none; }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding-top: 9px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 13px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
    .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .list { padding: 6px var(--pad); display: flex; flex-direction: column; gap: 8px; }
    .card { background: var(--card); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); border-inline-start: 4px solid #c9d2dc; }
    .card.status-inside { border-inline-start-color: var(--blue); background: #f7faff; }
    .card.status-done { border-inline-start-color: var(--green); }
    .card.status-done .pt-name { color: var(--muted); }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .patient-info { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; cursor: pointer; }
    .num-badge { color: var(--muted); font-weight: 600; font-size: 14px; min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
    .pt-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pt-phone { font-size: 13px; color: var(--muted); direction: ltr; text-align: right; }
    .status-btn { padding: 7px 13px; border-radius: 8px; border: 1px solid #ecd9a4; background: var(--amber-bg); color: var(--amber); font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0; min-width: 104px; }
    .status-btn.inside { background: var(--blue); border-color: var(--blue); color: #fff; }
    .status-btn.done { background: #e7f4ec; border-color: #bfe0cc; color: var(--green); }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; padding-top: 9px; border-top: 1px solid #edf0f4; align-items: center; }
    .badge { font-size: 12.5px; font-weight: 500; padding: 2px 9px; border-radius: 6px; display: inline-flex; align-items: center; background: #f1f4f7; color: #3b4856; }
    .badge-type-exam { background: var(--primary-light); color: var(--primary-dark); }
    .badge-type-consult { background: #efeafb; color: #5b3fa8; }
    .badge-fee { font-weight: 600; }
    .badge-note { background: #fdecea; color: #9b2c20; }
    .badge-call { background: #e8f0fb; color: var(--blue); text-decoration: none; }
    .badge-call::before { content: 'اتصال'; }
    .badge-call { font-size: 12.5px; }
    .badge-edit { margin-inline-start: auto; background: transparent; color: var(--primary); cursor: pointer; font-weight: 600; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1.3fr 1fr auto; gap: 8px; z-index: 60; }
    .btn-add { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 13px 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn-finish { background: #fff; color: var(--ink); border: 1px solid var(--ink); border-radius: 10px; padding: 13px 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn-menu { background: #fff; color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 0 16px; font-size: 18px; cursor: pointer; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(16,38,59,.55); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; width: 100%; max-width: 500px; border-radius: 16px 16px 0 0; padding: 18px 18px 26px; max-height: 92vh; overflow-y: auto; }
    @media (min-width: 640px) { .modal-backdrop { align-items: center; } .modal { border-radius: 14px; max-height: 88vh; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
    .modal-title { font-size: 17px; font-weight: 700; margin: 0; }
    .modal-note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
    .close-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; flex-shrink: 0; }
    .field-group { margin-bottom: 14px; position: relative; }
    .field-label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    .field-input { width: 100%; padding: 10px 12px; border: 1px solid #c8d1da; border-radius: 9px; font-size: 15px; outline: none; background: #fff; }
    .field-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,110,122,.12); }

    .autocomplete-box { background: #fff; border: 1px solid var(--primary); border-radius: 10px; margin-top: 4px; max-height: 170px; overflow-y: auto; display: none; box-shadow: 0 6px 16px rgba(16,38,59,.12); }
    .ac-item { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: var(--primary-light); }
    .history-banner { background: var(--primary-light); color: var(--primary-dark); padding: 9px 11px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 12px; display: none; }

    .quick-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .q-pill { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
    .q-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-save { width: 100%; background: var(--primary); color: #fff; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px; }
    .btn-outline { width: 100%; background: #fff; color: var(--ink); border: 1px solid #c8d1da; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn-danger { width: 100%; background: #fff; color: var(--red); border: 1px solid #efc4be; padding: 11px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px; }

    .day-list { display: flex; flex-direction: column; gap: 6px; }
    .day-row { display: flex; justify-content: space-between; align-items: center; width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text); }
    .day-row small { font-size: 12.5px; color: var(--muted); font-weight: 500; }
    .day-row.current { border-color: var(--primary); background: var(--primary-light); }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .sum-card { background: #f6f8fa; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .sum-card .val { font-size: 20px; font-weight: 700; color: var(--ink); }
    .sum-card .lbl { font-size: 12.5px; color: var(--muted); }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; }
    .summary-table th, .summary-table td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: right; }
    .summary-table th { color: var(--muted); font-weight: 600; }

    #loginOverlay { position: fixed; inset: 0; background: var(--ink); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 18px; }
    .login-card { background: #fff; width: 100%; max-width: 380px; border-radius: 14px; padding: 26px 22px; }
    .login-title { margin: 0 0 4px; font-size: 21px; font-weight: 700; color: var(--ink); }
    .login-sub { margin: 0 0 20px; font-size: 13.5px; color: var(--muted); }
    .login-msg { margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--red); min-height: 18px; }

    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 400; display: none; max-width: 90vw; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-card">
    <h2 class="login-title">تسجيل الدخول</h2>
    <p class="login-sub">عيادة د. حازم عبد الحميد — دخول الموظفين</p>
    <div class="field-group"><label class="field-label">الإيميل</label>
      <input type="email" class="field-input" id="loginEmail" autocomplete="username" style="direction:ltr; text-align:right;" /></div>
    <div class="field-group"><label class="field-label">كلمة السر</label>
      <input type="password" class="field-input" id="loginPass" autocomplete="current-password" style="direction:ltr; text-align:right;" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="btn-save" onclick="doLogin()">دخول</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="topbar" id="topbar">
  <div class="topbar-row">
    <div style="flex:1; min-width:0;">
      <input type="text" class="clinic-title" id="clinicTitleInput" readonly />
      <div class="role-badge" id="roleBadge" onclick="doLogout()">...</div>
    </div>
    <div class="header-actions">
      <span class="icon-btn conn" id="connDot">جاري الاتصال</span>
      <button class="icon-btn" onclick="openDirectoryModal()">سجل المرضى</button>
    </div>
  </div>
</div>

<!-- Clinic Day Selector (Saturday / Wednesday) -->
<div class="day-bar">
  <div class="day-select-wrap">
    <span class="day-lbl">يوم العيادة</span>
    <select class="day-select" id="daySelector" onchange="switchSession(this.value)"></select>
  </div>
  <button class="new-day-btn" onclick="openNewSessionModal()">يوم آخر</button>
</div>

<div class="stats-bar">
  <div class="stat-box"><div class="stat-num" style="color:var(--primary)" id="stat-total">0</div><div class="stat-lbl">الحالات</div></div>
  <div class="stat-box"><div class="stat-num" style="color:var(--amber)" id="stat-waiting">0</div><div class="stat-lbl">في الانتظار</div></div>
  <div class="stat-box"><div class="stat-num" style="color:var(--green)" id="stat-done">0</div><div class="stat-lbl">تم الكشف</div></div>
  <div class="stat-box"><div class="stat-num" style="color:var(--blue)" id="stat-total-fee">0</div><div class="stat-lbl">التحصيل (ج)</div></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="ابحث بالاسم أو رقم الدور أو الموبايل" oninput="handleSearch()" />
    <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="filters">
    <button class="chip active" onclick="setFilter('all', this)">الكل</button>
    <button class="chip" onclick="setFilter('waiting', this)">في الانتظار </button>
    <button class="chip" onclick="setFilter('inside', this)">عند الدكتور </button>
    <button class="chip" onclick="setFilter('done', this)">تم الكشف</button>
    <button class="chip" onclick="setFilter('exam', this)">كشوفات</button>
    <button class="chip" onclick="setFilter('consult', this)">استشارات</button>
  </div>
</div>

<div class="list" id="patientList"></div>

<div class="bottom-bar">
  <button class="btn-add" onclick="openPatientModal(null)">حجز جديد</button>
  <button class="btn-finish" onclick="openFinishDayModal()">إنهاء اليوم</button>
  <button class="btn-menu" onclick="openToolsModal()">⋮</button>
</div>

<!-- Add / Edit Patient Modal -->
<div class="modal-backdrop" id="patientModal" onclick="closeModalOnBg(event, 'patientModal')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="patientModalTitle">تسجيل مريض جديد</h3>
      <button class="close-btn" onclick="closeModal('patientModal')">إغلاق</button>
    </div>

    <div class="history-banner" id="historyBanner"></div>

    <div class="field-group">
      <label class="field-label">اسم المريض</label>
      <input type="text" class="field-input" id="ptName" placeholder="اكتب الاسم أو ابحث عن مريض سابق" oninput="onNameInput()" autocomplete="off" />
      <div class="autocomplete-box" id="autocompleteBox"></div>
    </div>

    <div class="field-group">
      <label class="field-label">رقم التليفون</label>
      <input type="tel" class="field-input" id="ptPhone" placeholder="01xxxxxxxxx" style="direction:ltr; text-align:right;" oninput="onPhoneInput()" />
    </div>

    <div class="field-group">
      <label class="field-label">نوع الزيارة والمبلغ</label>
      <div class="quick-pills" style="margin-bottom:8px;">
        <button type="button" class="q-pill" id="typeExamBtn" onclick="selectVisitType('exam', 200)">كشف (200 ج)</button>
        <button type="button" class="q-pill" id="typeConsultBtn" onclick="selectVisitType('consult', 0)">استشارة (0 ج)</button>
        <button type="button" class="q-pill" id="typeCustomBtn" onclick="selectVisitType('exam', '')">مبلغ مخصص</button>
      </div>
      <input type="number" class="field-input" id="ptFee" placeholder="المبلغ بالجنيه" style="direction:ltr; text-align:right;" />
    </div>

    <div class="field-group">
      <label class="field-label">طريقة الدفع</label>
      <div class="quick-pills">
        <button type="button" class="q-pill pay-pill active" data-pay="كاش" onclick="selectPayMethod('كاش', this)">كاش</button>
        <button type="button" class="q-pill pay-pill" data-pay="إنستاباي" onclick="selectPayMethod('إنستاباي', this)">إنستاباي</button>
        <button type="button" class="q-pill pay-pill" data-pay="آجل / مجاني" onclick="selectPayMethod('آجل / مجاني', this)">بدون مبلغ</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">ملاحظات (اختياري)</label>
      <input type="text" class="field-input" id="ptNote" placeholder="مثال: حجز تليفوني، مستعجل" />
      <div class="quick-pills">
        <button type="button" class="q-pill" onclick="appendNote('حجز تليفون')">حجز تليفون</button>
        <button type="button" class="q-pill" onclick="appendNote('مستعجل')">مستعجل</button>
      </div>
    </div>

    <button class="btn-save" onclick="savePatient()">حفظ الحجز</button>
    <button class="btn-danger" id="deletePtBtn" style="display:none;" onclick="deletePatient()">حذف الحجز</button>
  </div>
</div>

<!-- New Clinic Day Modal -->
<div class="modal-backdrop" id="newSessionModal" onclick="closeModalOnBg(event, 'newSessionModal')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">فتح يوم عيادة</h3>
      <button class="close-btn" onclick="closeModal('newSessionModal')">إغلاق</button>
    </div>
    <p class="modal-note">أيام العيادة القادمة (السبت والأربعاء). الأيام السابقة تفضل محفوظة في القائمة.</p>
    <div class="day-list" id="upcomingClinicDays"></div>
  </div>
</div>

<!-- Finish Day & Full Summary Modal -->
<div class="modal-backdrop" id="finishModal" onclick="closeModalOnBg(event, 'finishModal')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">ملخص اليوم</h3>
      <button class="close-btn" onclick="closeModal('finishModal')">إغلاق</button>
    </div>
    <div id="summaryContent"></div>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
      <button class="btn-save" onclick="shareWhatsAppReport()">إرسال التقرير على واتساب</button>
      <button class="btn-outline" onclick="exportSessionExcel()">تحميل ملف إكسيل</button>
      <button class="btn-outline" onclick="copyTextReport()">نسخ التقرير</button>
    </div>
  </div>
</div>

<!-- Directory Modal (Returning Patients) -->
<div class="modal-backdrop" id="directoryModal" onclick="closeModalOnBg(event, 'directoryModal')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">سجل المرضى (<span id="dirCount">0</span>)</h3>
      <button class="close-btn" onclick="closeModal('directoryModal')">إغلاق</button>
    </div>
    <input type="text" class="field-input" id="dirSearch" placeholder="ابحث بالاسم أو الرقم" oninput="renderDirectory()" style="margin-bottom:10px;" />
    <div id="directoryList" style="max-height:55vh; overflow-y:auto;"></div>
  </div>
</div>

<!-- Tools & Admin Settings Modal -->
<div class="modal-backdrop" id="toolsModal" onclick="closeModalOnBg(event, 'toolsModal')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">الإعدادات</h3>
      <button class="close-btn" onclick="closeModal('toolsModal')">إغلاق</button>
    </div>
    <div id="adminToolsSection" style="display:flex; flex-direction:column; gap:9px;">
      <button class="btn-outline" onclick="refreshAll(); showToast('تم التحديث');">تحديث البيانات</button>
      <button class="btn-outline" onclick="doLogout()">تسجيل الخروج</button>
      <button class="btn-danger" id="clearDayBtn" style="display:none;" onclick="clearCurrentSession()">تفريغ قائمة اليوم (مدير)</button>
    </div>
  </div>
</div>

<script>
/* ==================== CONFIG (عدّل القيمتين دول بس) ==================== */
const CONFIG = {
  SUPABASE_URL: 'https://nmbnvnvxlfxcnmvybxaa.supabase.co',        // مثال: https://abcdxyz.supabase.co
  SUPABASE_ANON_KEY: 'sb_publishable_WD67eZfPEuFp0OfJsfQUUQ_vVStGp2L',      // Project Settings > API > anon public

let sb = null;
let isAdmin = false;
let me = null;
let channel = null;
let refreshTimer = null;
let saving = false;
let db = { clinicTitle: CONFIG.CLINIC_TITLE, activeDay: null, days: [], patients: [], directory: [] };
let currentFilter = 'all';
let searchQuery = '';
let editingId = null;
let selectedType = 'exam';
let selectedPay = 'كاش';
let acMatches = [];

const DAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
function dayLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${DAY_NAMES[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
}
function getCurrentSession() {
  return { id: db.activeDay, label: dayLabel(db.activeDay), patients: db.patients };
}
function fail(e) {
  console.error(e);
  const msg = (e && e.message) || '';
  if (msg.includes('LOCKED')) showToast('غير مسموح — للمدير فقط');
  else if (msg.includes('row-level security')) showToast('ليس لديك صلاحية');
  else showToast('خطأ: ' + (msg || 'تعذر الاتصال بالسيرفر').slice(0, 90) + (e && e.code ? ' [' + e.code + ']' : ''));
}
function mapVisit(r) {
  return { id: r.id, name: r.name, phone: r.phone || '', type: r.type, fee: r.fee,
    payMethod: r.pay_method, note: r.note || '', status: r.status, updatedAt: Date.parse(r.updated_at) || 0 };
}
function mapPatient(r) {
  return { id: r.id, name: r.name, phone: r.phone || '', lastVisit: r.last_visit || '',
    lastType: r.last_type || 'exam', visitsCount: r.visits_count || 1 };
}

/* ==================== AUTH ==================== */
function showLogin(msg) {
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginMsg').textContent = msg || '';
}
function hideLogin() { document.getElementById('loginOverlay').style.display = 'none'; }

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!email || !password) return showLogin('اكتب الإيميل وكلمة السر');
  document.getElementById('loginMsg').textContent = 'جاري الدخول...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    const bad = /invalid login|invalid credentials/i.test(error.message || '');
    return showLogin(bad ? 'الإيميل أو كلمة السر غير صحيحة' : 'خطأ في الدخول: ' + (error.message || '') + ' (' + (error.status || error.code || '') + ')');
  }
  await afterLogin(data.user);
}

async function doLogout() {
  if (!confirm('تسجيل الخروج؟')) return;
  if (channel) { sb.removeChannel(channel); channel = null; }
  await sb.auth.signOut();
  me = null; isAdmin = false; closeModal('toolsModal');
  showLogin('');
}

async function afterLogin(user) {
  const { data: prof, error } = await sb.from('profiles').select('role, full_name').eq('id', user.id).maybeSingle();
  if (error) { showLogin('خطأ في قراءة الصلاحيات: ' + (error.message || '') + ' [' + (error.code || '') + ']'); return; }
  if (!prof) {
    await sb.auth.signOut();
    return showLogin('الحساب غير مفعّل — اطلب من المدير تفعيله');
  }
  me = prof;
  isAdmin = prof.role === 'admin';
  hideLogin();
  const saved = localStorage.getItem('clinic_active_day');
  db.activeDay = saved || getNextClinicDates()[0].id;
  updateRoleUI();
  await refreshAll();
  subscribeRealtime();
}

/* ==================== DATA LOADING ==================== */
async function loadDays() {
  const { data, error } = await sb.from('day_counts').select('day, n');
  if (error) throw error;
  db.days = data.map(r => ({ day: r.day, n: Number(r.n) }));
}
async function loadPatients() {
  const { data, error } = await sb.from('visits').select('*')
    .eq('day', db.activeDay).order('created_at').order('id');
  if (error) throw error;
  db.patients = data.map(mapVisit);
}
async function loadDirectory() {
  const { data, error } = await sb.from('patients').select('*').order('name').limit(5000);
  if (error) throw error;
  db.directory = data.map(mapPatient);
}
async function refreshAll() {
  try {
    await Promise.all([loadDays(), loadPatients(), loadDirectory()]);
    render();
  } catch (e) { fail(e); }
}
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { if (me) refreshAll(); }, 250);
}

/* ==================== REALTIME ==================== */
function setConn(ok) {
  const el = document.getElementById('connDot');
  el.textContent = ok ? 'متصل' : 'غير متصل';
  el.classList.toggle('off', !ok);
}
function subscribeRealtime() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('clinic-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'visits' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'patients' }, scheduleRefresh)
    .subscribe(status => {
      setConn(status === 'SUBSCRIBED');
      if (status === 'SUBSCRIBED') scheduleRefresh();
    });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && me) scheduleRefresh(); });
window.addEventListener('online', () => { if (me) scheduleRefresh(); });
window.addEventListener('offline', () => setConn(false));

/* ==================== ROLE UI ==================== */
function updateRoleUI() {

  } else {
    topbar.classList.remove('admin-mode');
    badge.textContent = 'استقبال' + who;
  }
  if (clearBtn) clearBtn.style.display = isAdmin ? 'block' : 'none';
}

/* ==================== CLINIC DAYS ==================== */
function renderDaySelector() {
  const map = new Map();
  db.days.forEach(d => map.set(d.day, d.n));
  getNextClinicDates().forEach(u => { if (!map.has(u.id)) map.set(u.id, 0); });
  map.set(db.activeDay, db.patients.length);
  const keys = [...map.keys()].sort().reverse();
  document.getElementById('daySelector').innerHTML = keys.map(k =>
    `<option value="${k}" ${k === db.activeDay ? 'selected' : ''}>${esc(dayLabel(k))} (${map.get(k)})</option>`).join('');
}

async function switchSession(id) {
  db.activeDay = id;
  localStorage.setItem('clinic_active_day', id);
  await refreshAll();
}

function openNewSessionModal() {
  const box = document.getElementById('upcomingClinicDays');
  box.innerHTML = getNextClinicDates().map(u => {
    const exists = db.days.some(d => d.day === u.id) || u.id === db.activeDay;
    return `<button class="day-row ${u.id === db.activeDay ? 'current' : ''}" onclick="selectOrCreateSession('${u.id}')">
      <span>${esc(u.label)}</span>
      <small>${u.id === db.activeDay ? 'الحالي' : (exists ? 'فيه حجوزات' : 'يوم جديد')}</small>
    </button>`;
  }).join('');
  document.getElementById('newSessionModal').classList.add('open');

async function selectOrCreateSession(id) {
  closeModal('newSessionModal');

}
function createCustomSession() {
  const v = document.getElementById('customSessionDate').value;
  if (!v) return showToast('اختر التاريخ أولاً');
  selectOrCreateSession(v);
}

async function clearCurrentSession() {
  if (!isAdmin) return showToast('هذه الصلاحية للمدير فقط');
  const sess = getCurrentSession();
  if (!confirm(`هل أنت متأكد من مسح جميع حالات (${sess.label})؟`)) return;
  const { error } = await sb.from('visits').delete().eq('day', db.activeDay);
  if (error) return fail(error);

/* ==================== PATIENTS ==================== */
function pickDirectoryPatient(name, phone, lastVisit, lastType) {
  document.getElementById('ptName').value = name;
  document.getElementById('ptPhone').value = phone;
  document.getElementById('autocompleteBox').style.display = 'none';

  const banner = document.getElementById('historyBanner');
  if (!lastVisit) return;
  const diff = Math.round((new Date(db.activeDay + 'T00:00:00') - new Date(lastVisit + 'T00:00:00')) / 86400000);
  banner.style.display = 'block';
  if (diff === 0) {
    banner.innerHTML = 'المريض مسجل بالفعل في هذا اليوم';
  } else if (lastType === 'exam' && diff > 0 && diff <= 14) {
    banner.innerHTML = `مريض متكرر (آخر كشف: منذ ${diff} يوم) — تم ضبطها كـ <u>استشارة مجانية</u> تلقائياً`;
    selectVisitType('consult', 0);
    selectPayMethod('آجل / مجاني', document.querySelector('[data-pay="آجل / مجاني"]'));
  } else {
    banner.innerHTML = `مريض مسجل سابقاً (آخر زيارة: ${diff > 0 ? 'منذ ' + diff + ' يوم' : esc(lastVisit)})`;
  }
}

function openPatientModal(id) {
  const sess = getCurrentSession();
  editingId = id;
  document.getElementById('autocompleteBox').style.display = 'none';
  document.getElementById('historyBanner').style.display = 'none';
  const delBtn = document.getElementById('deletePtBtn');

  if (id === null) {
    document.getElementById('patientModalTitle').textContent = `حجز جديد — دور رقم ${sess.patients.length + 1}`;
    document.getElementById('ptName').value = '';
    document.getElementById('ptPhone').value = '';
    document.getElementById('ptNote').value = '';
    selectPayMethod('كاش', document.querySelector('[data-pay="كاش"]'));
    selectVisitType('exam', 200);
    delBtn.style.display = 'none';
  } else {
    const pt = sess.patients.find(p => p.id === id);
    if (!pt) return;
    if (!isAdmin && pt.status === 'done') {
      showToast('تم الكشف بالفعل — التعديل متاح للمدير فقط');
      return;
    }
    document.getElementById('patientModalTitle').textContent = 'تعديل بيانات المريض';
    document.getElementById('ptName').value = pt.name;
    document.getElementById('ptPhone').value = pt.phone || '';
    document.getElementById('ptFee').value = pt.fee;
    document.getElementById('ptNote').value = pt.note || '';
    selectedType = pt.type || 'exam';
    document.getElementById('typeExamBtn').classList.toggle('active', selectedType === 'exam' && Number(pt.fee) === 200);
    document.getElementById('typeConsultBtn').classList.toggle('active', selectedType === 'consult');
    document.getElementById('typeCustomBtn').classList.toggle('active', selectedType === 'exam' && Number(pt.fee) !== 200);
    selectPayMethod(pt.payMethod || 'كاش', document.querySelector(`[data-pay="${pt.payMethod || 'كاش'}"]`));
    delBtn.style.display = isAdmin ? 'block' : 'none';
  }
  document.getElementById('patientModal').classList.add('open');
  setTimeout(() => document.getElementById('ptName').focus(), 120);
}

async function savePatient() {
  if (saving) return;
  const name = document.getElementById('ptName').value.trim();
  if (!name) return showToast('اكتب اسم المريض أولاً');
  const phone = document.getElementById('ptPhone').value.trim();
  const fee = Number(document.getElementById('ptFee').value) || 0;
  const note = document.getElementById('ptNote').value.trim();
  const row = { name, phone, type: selectedType, fee, note, pay_method: fee === 0 ? 'آجل / مجاني' : selectedPay };

  saving = true;
  try {
    if (editingId === null) {
      const { error } = await sb.from('visits').insert({ ...row, day: db.activeDay, status: 'waiting' });
      if (error) return fail(error);
      showToast('تم تسجيل الحجز');
    } else {
      const pt = db.patients.find(p => p.id === editingId);
      if (!isAdmin && pt && Number(pt.fee) !== fee) return showToast('تعديل المبلغ متاح للمدير فقط');
      const { data, error } = await sb.from('visits').update(row).eq('id', editingId).select('id');
      if (error) return fail(error);
      if (!data.length) return showToast('غير مسموح بالتعديل');
      showToast('تم حفظ التعديل');
    }
    closeModal('patientModal');
    await refreshAll();
  } finally { saving = false; }
}

async function deletePatient() {
  if (!isAdmin) return showToast('الحذف للمدير فقط');
  if (!confirm('حذف هذا المريض نهائياً من قائمة اليوم؟')) return;
  const { data, error } = await sb.from('visits').delete().eq('id', editingId).select('id');
  if (error) return fail(error);
  if (!data.length) return showToast('غير مسموح بالحذف');
  closeModal('patientModal');
  await refreshAll();
  showToast('تم الحذف');
}

async function cycleStatus(id) {
  const pt = db.patients.find(p => p.id === id);
  if (!pt) return;
  if (!isAdmin && pt.status === 'done') return showToast('تم تأكيد الكشف — للتراجع اطلب المدير');
  const order = ['waiting', 'inside', 'done'];
  const next = order[(order.indexOf(pt.status) + 1) % order.length];
  const { data, error } = await sb.from('visits').update({ status: next }).eq('id', id).select('id');
  if (error) return fail(error);
  if (!data.length) return showToast('غير مسموح');
  pt.status = next; // instant feedback; realtime refresh confirms
  render();
}

/* ==================== RENDER ==================== */
function renderList() {
  const sess = getCurrentSession();
  const container = document.getElementById('patientList');
  const statusLabels = {
    waiting: { text: 'في الانتظار', cls: '' },
    inside: { text: 'عند الدكتور', cls: 'inside' },
    done: { text: 'تم الكشف', cls: 'done' }
  };

  const filtered = sess.patients.filter((p, idx) => {
    if (searchQuery) {
      const mName = p.name.toLowerCase().includes(searchQuery);
      const mPhone = (p.phone || '').includes(searchQuery);
      const mTurn = String(idx + 1) === searchQuery;
      if (!mName && !mPhone && !mTurn) return false;
    }
    if (currentFilter === 'waiting') return p.status === 'waiting';
    if (currentFilter === 'inside') return p.status === 'inside';
    if (currentFilter === 'done') return p.status === 'done';
    if (currentFilter === 'exam') return p.type !== 'consult';
    if (currentFilter === 'consult') return p.type === 'consult';
    return true;
  });

  if (!filtered.length) {
    container.innerHTML = `<div style="text-align:center; padding:38px 16px; color:var(--muted); font-weight:600;">
      قائمة <strong>${esc(sess.label)}</strong> فارغة حالياً<br><small>اضغط "+ حجز / تسجيل مريض" لإضافة أول حالة</small>
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(p => {
    const turnNum = sess.patients.indexOf(p) + 1;
    const st = statusLabels[p.status] || statusLabels.waiting;
    const cardCls = p.status === 'inside' ? 'card status-inside' : (p.status === 'done' ? 'card status-done' : 'card');
    const isConsult = p.type === 'consult';
    return `
      <div class="${cardCls}">
        <div class="card-top">
          <div class="patient-info" onclick="openPatientModal('${p.id}')">
            <div class="num-badge">${turnNum}</div>
            <div style="min-width:0;">
              <div class="pt-name">${esc(p.name)}</div>
              ${p.phone ? `<div class="pt-phone">${esc(p.phone)}</div>` : ''}
            </div>
          </div>
          <button class="status-btn ${st.cls}" onclick="cycleStatus('${p.id}')">${st.text}</button>
        </div>
        <div class="meta-row">
          <span class="badge ${isConsult ? 'badge-type-consult' : 'badge-type-exam'}">${isConsult ? 'استشارة' : 'كشف'}</span>
          <span class="badge badge-fee">${p.fee} ج</span>
          ${p.fee > 0 ? `<span class="badge badge-pay">${esc(p.payMethod || 'كاش')}</span>` : ''}
          ${p.note ? `<span class="badge badge-note">${esc(p.note)}</span>` : ''}
          ${p.phone ? `<a class="badge badge-call" href="tel:${esc(p.phone)}" onclick="event.stopPropagation()"></a>` : ''}
          <span class="badge badge-edit" onclick="openPatientModal('${p.id}')">تعديل</span>
        </div>
      </div>
    `;
  }).join('');
}

function render() {
  const sess = getCurrentSession();
  document.getElementById('clinicTitleInput').value = db.clinicTitle;
  renderDaySelector();
  document.getElementById('stat-total').textContent = sess.patients.length;
  document.getElementById('stat-waiting').textContent = sess.patients.filter(p => p.status === 'waiting').length;
  document.getElementById('stat-done').textContent = sess.patients.filter(p => p.status === 'done').length;
  document.getElementById('stat-total-fee').textContent = sess.patients.reduce((s, p) => s + (Number(p.fee) || 0), 0);
  renderList();
}

(async function init() {
  document.getElementById('clinicTitleInput').value = db.clinicTitle;
  if (CONFIG.SUPABASE_URL.includes('YOUR-') || CONFIG.SUPABASE_ANON_KEY.includes('YOUR-')) {
    return showLogin('لازم تحط SUPABASE_URL و SUPABASE_ANON_KEY في أول السكربت');
  }
  if (typeof supabase === 'undefined') return showLogin('تعذر تحميل مكتبة Supabase — تأكد من الإنترنت');
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session) await afterLogin(session.user); else showLogin('');
})();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2700);
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function localISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getNextClinicDates() {
  const results = [];
  const d = new Date();
  for (let i = 0; i < 31 && results.length < 6; i++) {
    const day = d.getDay(); // 6 = Saturday, 3 = Wednesday
    if (day === 6 || day === 3) {
      const dayName = day === 6 ? 'السبت' : 'الأربعاء';
      const iso = localISO(d);
      const label = `${dayName} ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
      results.push({ id: iso, label });
    }
    d.setDate(d.getDate() + 1);
  }
  return results;
}

function selectVisitType(type, defaultFee) {
  selectedType = type;
  document.getElementById('typeExamBtn').classList.toggle('active', type === 'exam' && defaultFee === 200);
  document.getElementById('typeConsultBtn').classList.toggle('active', type === 'consult');
  document.getElementById('typeCustomBtn').classList.toggle('active', defaultFee === '');
  if (defaultFee !== '') {
    document.getElementById('ptFee').value = defaultFee;
    if (defaultFee === 0) {
      selectPayMethod('آجل / مجاني', document.querySelector('[data-pay="آجل / مجاني"]'));
    } else if (selectedPay === 'آجل / مجاني') {
      selectPayMethod('كاش', document.querySelector('[data-pay="كاش"]'));
    }
  } else {
    document.getElementById('ptFee').value = '';
    document.getElementById('ptFee').focus();
  }
}

function selectPayMethod(method, el) {
  selectedPay = method;
  document.querySelectorAll('.pay-pill').forEach(p => p.classList.remove('active'));
  if (el) el.classList.add('active');
}

function appendNote(txt) {
  const inp = document.getElementById('ptNote');
  const cur = inp.value.trim();
  if (!cur) inp.value = txt;
  else if (!cur.includes(txt)) inp.value = cur + ' - ' + txt;
}

function onPhoneInput() {
  const ph = document.getElementById('ptPhone').value.trim();
  if (ph.length >= 7) {
    const found = db.directory.find(p => p.phone === ph);
    if (found && !document.getElementById('ptName').value.trim()) {
      pickDirectoryPatient(found.name, found.phone, found.lastVisit, found.lastType);
    }
  }
}

function onNameInput() {
  const val = document.getElementById('ptName').value.trim().toLowerCase();
  const box = document.getElementById('autocompleteBox');
  if (val.length < 2) {
    box.style.display = 'none';
    return;
  }
  const matches = db.directory.filter(p => p.name.toLowerCase().includes(val) || (p.phone && p.phone.includes(val))).slice(0, 6);
  if (!matches.length) {
    box.style.display = 'none';
    return;
  }
  acMatches = matches;
  box.innerHTML = matches.map((m, idx) => `
    <div class="ac-item" onclick="pickAC(${idx})">
      <div>
        <strong>${esc(m.name)}</strong>
        <div style="font-size:11px; color:var(--muted);">${esc(m.phone) || 'بدون رقم'} • زيارات سابقة: ${m.visitsCount || 1}</div>
      </div>
      <span style="font-size:11px; color:var(--primary); font-weight:700;">اختيار ↵</span>
    </div>
  `).join('');
  box.style.display = 'block';
}

function pickAC(i) {
  const m = acMatches[i];
  if (m) pickDirectoryPatient(m.name, m.phone, m.lastVisit, m.lastType);
}

function buildReportText() {
  const sess = getCurrentSession();
  const exams = sess.patients.filter(p => p.type !== 'consult');
  const consults = sess.patients.filter(p => p.type === 'consult');
  const cashTotal = sess.patients.filter(p => (p.payMethod || 'كاش') === 'كاش').reduce((s, p) => s + (Number(p.fee) || 0), 0);
  const instaTotal = sess.patients.filter(p => p.payMethod === 'إنستاباي').reduce((s, p) => s + (Number(p.fee) || 0), 0);
  const grandTotal = sess.patients.reduce((s, p) => s + (Number(p.fee) || 0), 0);
  const doneCount = sess.patients.filter(p => p.status === 'done').length;

  let lines = [
    `📊 *ملخص تقفيل ${db.clinicTitle}*`,
    `📅 اليوم: ${sess.label}`,
    `━━━━━━━━━━━━━━━`,
    `💰 *الإيراد الكلي: ${grandTotal} جنيه*`,
    `💵 كاش: ${cashTotal} ج | 📱 إنستاباي: ${instaTotal} ج`,
    `👥 الحالات: ${sess.patients.length} (كشف: ${exams.length} | استشارة: ${consults.length})`,
    `✅ تم الكشف: ${doneCount} حالة`,
    `━━━━━━━━━━━━━━━`,
    `*أولاً: الكشوفات (${exams.length})*`
  ];
  exams.forEach((p, idx) => {
    const st = p.status === 'done' ? '✅' : '⏳';
    lines.push(`${idx + 1}. ${st} ${p.name} — ${p.fee} ج (${p.payMethod || 'كاش'})${p.note ? ' [' + p.note + ']' : ''}`);
  });
  if (consults.length) {
    lines.push(`\n*ثانياً: الاستشارات (${consults.length})*`);
    consults.forEach((p, idx) => {
      lines.push(`${idx + 1}. ${p.status === 'done' ? '✅' : '⏳'} ${p.name}${p.note ? ' [' + p.note + ']' : ''}`);
    });
  }
  return lines.join('\n');
}

function shareWhatsAppReport() {
  window.open('https://wa.me/?text=' + encodeURIComponent(buildReportText()), '_blank');
}

function copyTextReport() {
  navigator.clipboard.writeText(buildReportText()).then(() => showToast('تم نسخ ملخص اليوم'));
}

function exportSessionExcel() {
  if (typeof XLSX === 'undefined') return showToast('تأكد من الاتصال بالإنترنت للتصدير');
  const sess = getCurrentSession();
  const statusTxt = p => p.status === 'done' ? 'تم الكشف' : (p.status === 'inside' ? 'عند الدكتور' : 'في الانتظار');
  const num = p => Number(p.fee) || 0;
  const exams = sess.patients.filter(p => p.type !== 'consult');
  const consults = sess.patients.filter(p => p.type === 'consult');
  const sum = arr => arr.reduce((t, p) => t + num(p), 0);
  const cashTotal = sum(sess.patients.filter(p => (p.payMethod || 'كاش') === 'كاش'));
  const instaTotal = sum(sess.patients.filter(p => p.payMethod === 'إنستاباي'));
  const grandTotal = sum(sess.patients);

  const examRows = [['م', 'اسم المريض', 'رقم التليفون', 'المبلغ (ج)', 'طريقة الدفع', 'الحالة', 'ملاحظات']];
  exams.forEach((p, i) => examRows.push([i + 1, p.name, p.phone || '', num(p), p.payMethod || 'كاش', statusTxt(p), p.note || '']));
  examRows.push(['', 'الإجمالي', '', sum(exams), '', '', '']);

  const consultRows = [['م', 'اسم المريض', 'رقم التليفون', 'المبلغ (ج)', 'الحالة', 'ملاحظات']];
  consults.forEach((p, i) => consultRows.push([i + 1, p.name, p.phone || '', num(p), statusTxt(p), p.note || '']));

  const summaryRows = [
    ['ملخص اليوم', ''],
    ['العيادة', db.clinicTitle],
    ['اليوم', sess.label],
    ['', ''],
    ['عدد الكشوفات', exams.length],
    ['عدد الاستشارات', consults.length],
    ['إجمالي الحالات', sess.patients.length],
    ['حالات تم كشفها', sess.patients.filter(p => p.status === 'done').length],
    ['', ''],
    ['إجمالي الكاش (ج)', cashTotal],
    ['إجمالي إنستاباي (ج)', instaTotal],
    ['آجل / مجاني (ج)', grandTotal - cashTotal - instaTotal],
    ['إجمالي الإيراد (ج)', grandTotal]
  ];

  const mk = (rows, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = widths.map(w => ({ wch: w }));
    return ws;
  };
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, mk(examRows, [5, 24, 16, 12, 14, 14, 24]), 'الكشوفات');
  XLSX.utils.book_append_sheet(wb, mk(consultRows, [5, 24, 16, 12, 14, 24]), 'الاستشارات');
  XLSX.utils.book_append_sheet(wb, mk(summaryRows, [24, 26]), 'الملخص');
  XLSX.writeFile(wb, `عيادة_${sess.label.replace(/[\/\\:*?"<>|]/g, '-')}.xlsx`);
  showToast('تم تحميل ملف الإكسيل');
}

function openFinishDayModal() {
  const sess = getCurrentSession();
  const exams = sess.patients.filter(p => p.type !== 'consult');
  const consults = sess.patients.filter(p => p.type === 'consult');
  const doneCount = sess.patients.filter(p => p.status === 'done').length;
  const cashTotal = sess.patients.filter(p => (p.payMethod || 'كاش') === 'كاش').reduce((s, p) => s + (Number(p.fee) || 0), 0);
  const instaTotal = sess.patients.filter(p => p.payMethod === 'إنستاباي').reduce((s, p) => s + (Number(p.fee) || 0), 0);
  const grandTotal = sess.patients.reduce((s, p) => s + (Number(p.fee) || 0), 0);
  const otherTotal = grandTotal - cashTotal - instaTotal;

  let html = `
    <div style="font-weight:800; font-size:14px; color:var(--primary-dark); margin-bottom:10px;">
      ${esc(db.clinicTitle)} — ${esc(sess.label)}
    </div>
    <div class="summary-grid">
      <div class="sum-card"><div class="val">${grandTotal} ج</div><div class="lbl">إجمالي الإيراد اليومي</div></div>
      <div class="sum-card"><div class="val">${doneCount} / ${sess.patients.length}</div><div class="lbl">حالات تم كشفها</div></div>
      <div class="sum-card"><div class="val" style="color:#15803d;">${cashTotal} ج</div><div class="lbl">إجمالي الكاش</div></div>
      <div class="sum-card"><div class="val" style="color:#1d4ed8;">${instaTotal} ج</div><div class="lbl">إجمالي إنستاباي</div></div>
    </div>
    <div class="summary-grid">
      <div class="sum-card"><div class="val">${exams.length} / ${consults.length}</div><div class="lbl">كشوفات / استشارات</div></div>
      <div class="sum-card"><div class="val" style="color:#854d0e;">${otherTotal} ج</div><div class="lbl">آجل / مجاني</div></div>
    </div>
    <table class="summary-table">
      <thead><tr><th>#</th><th>الاسم</th><th>النوع</th><th>المبلغ</th><th>الدفع</th><th>الحالة</th></tr></thead>
      <tbody>
        ${sess.patients.map((p, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${esc(p.name)}${p.note ? ` <small style="color:#be123c">(${esc(p.note)})</small>` : ''}</td>
            <td>${p.type === 'consult' ? 'استشارة' : 'كشف'}</td>
            <td>${p.fee} ج</td>
            <td>${esc(p.payMethod || 'كاش')}</td>
            <td>${p.status === 'done' ? 'تم' : (p.status === 'inside' ? 'بالداخل' : 'انتظار')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  document.getElementById('summaryContent').innerHTML = html;
  document.getElementById('finishModal').classList.add('open');
}

function renderDirectory() {
  const q = document.getElementById('dirSearch').value.trim().toLowerCase();
  const list = db.directory.map((d, i) => ({ d, i }))
    .filter(({ d }) => d.name.toLowerCase().includes(q) || (d.phone && d.phone.includes(q)));
  document.getElementById('dirCount').textContent = db.directory.length;
  document.getElementById('directoryList').innerHTML = list.map(({ d, i }) => `
    <div style="padding:9px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-weight:700; font-size:14px;">${esc(d.name)}</div>
        <div style="font-size:11.5px; color:var(--muted);">${esc(d.phone) || 'بدون رقم'} • آخر زيارة: ${esc(d.lastVisit) || '-'}</div>
      </div>
      <button class="q-pill" style="background:var(--primary-light); color:var(--primary);" onclick="bookFromDirectory(${i})">+ حجز</button>
    </div>
  `).join('');
}

function bookFromDirectory(i) {
  const d = db.directory[i];
  if (!d) return;
  closeModal('directoryModal');
  openPatientModal(null);
  pickDirectoryPatient(d.name, d.phone || '', d.lastVisit || '', d.lastType || 'exam');
}

function openDirectoryModal() {
  document.getElementById('dirSearch').value = '';
  renderDirectory();
  document.getElementById('directoryModal').classList.add('open');
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('clearSearchBtn').style.display = searchQuery ? 'block' : 'none';
  renderList();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  renderList();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function openToolsModal() { updateRoleUI(); document.getElementById('toolsModal').classList.add('open'); }

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function closeModalOnBg(e, id) { if (e.target.id === id) closeModal(id); }
</script>
</body>
